name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Conan for the integration tests (they run 'conan install' on a throwaway project).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        run: |
          pip install "conan>=2,<3"
          conan profile detect

      # A lockfile generated behind a private npm mirror records the mirror's URLs, which the
      # runners can't reach ('npm ci' then fails with "Exit handler never called!").
      - name: Check lockfile uses the public npm registry
        shell: bash
        run: |
          if grep '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
            echo "::error file=package-lock.json::package-lock.json must resolve packages from https://registry.npmjs.org/. See 'Development' in README.md."
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # The extension is plain JavaScript, so one package serves every platform.
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out vscode-conan.vsix

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vscode-conan-vsix
          path: vscode-conan.vsix
          if-no-files-found: error
